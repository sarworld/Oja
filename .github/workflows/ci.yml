name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Typecheck, build & test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- server ---------------------------------------------------------
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      # --- web ------------------------------------------------------------
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Test web
        working-directory: web
        run: npm test

  test-postgres:
    name: Server tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server deps
        working-directory: server
        run: npm ci
      # Run the same suite against a real Postgres so dialect regressions
      # (e.g. text-vs-date comparisons) are caught automatically.
      - name: Test server against Postgres
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oja_test
        run: npm test -- --no-file-parallelism

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Validate the production image builds (amd64, no push) so a broken
      # Dockerfile is caught on every push/PR — long before a release tag.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
